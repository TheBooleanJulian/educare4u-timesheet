<!DOCTYPE html>
<html lang="en">
<head>

<style>
/* Sam Unified UI tokens — copied from tbj-brand dist/tokens.css 1.0.0. Re-copy, don't hand-edit. */
:root {
  color-scheme: dark light;
  --font-display: "Chakra Petch", "Rajdhani", system-ui, sans-serif;
  --font-sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;

  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-5: 24px; --space-6: 32px; --space-7: 48px;

  --dur-fast: 120ms; --dur-base: 200ms; --dur-slow: 360ms; --ease-out: cubic-bezier(0.2, 0.8, 0.2, 1);
  --bg: #05060d; --surface: #0b0e1a; --surface-raised: #121629; --surface-overlay: #1a2040;
  --scrim: rgba(2, 3, 8, 0.72); --line: #262d52; --line-strong: #6370b6;
  --ink: #e8ecff; --ink-muted: #9ca5d4; --ink-faint: #8089bd;
  --cyan: #00e5ff; --magenta: #ff2bd6; --cyan-ink: #19e6ff; --magenta-ink: #ff6be2;
  --cyan-tint: rgba(0, 229, 255, 0.10); --magenta-tint: rgba(255, 43, 214, 0.12);
  --on-accent: #02101a; --focus-ring: var(--cyan-ink);
  --success: #2de2a6; --warning: #ffc233; --danger: #ff6482;
  --glow-cyan: 0 0 0 1px rgba(0, 229, 255, 0.55), 0 0 18px rgba(0, 229, 255, 0.30);
  --glow-magenta: 0 0 0 1px rgba(255, 43, 214, 0.55), 0 0 18px rgba(255, 43, 214, 0.30);
  --elevation: 0 12px 32px rgba(0, 0, 0, 0.55);
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f3f5ff; --surface: #ffffff; --surface-raised: #eaeefc; --surface-overlay: #dde3f9;
    --scrim: rgba(11, 16, 48, 0.38); --line: #cdd4f0; --line-strong: #6c76a8;
    --ink: #0b1030; --ink-muted: #414a78; --ink-faint: #5a6391;
    --cyan: #00c8e8; --magenta: #f01fc8; --cyan-ink: #00657d; --magenta-ink: #a8008a;
    --cyan-tint: rgba(0, 101, 125, 0.08); --magenta-tint: rgba(168, 0, 138, 0.08);
    --on-accent: #02101a; --success: #00704f; --warning: #7f5400; --danger: #c4003a;
    --glow-cyan: 0 0 0 1px rgba(0, 101, 125, 0.60), 0 4px 14px rgba(0, 200, 232, 0.28);
    --glow-magenta: 0 0 0 1px rgba(168, 0, 138, 0.60), 0 4px 14px rgba(240, 31, 200, 0.25);
    --elevation: 0 12px 28px rgba(11, 16, 48, 0.16);
  }
}
:root[data-theme="light"] {
  --bg: #f3f5ff; --surface: #ffffff; --surface-raised: #eaeefc; --surface-overlay: #dde3f9;
  --scrim: rgba(11, 16, 48, 0.38); --line: #cdd4f0; --line-strong: #6c76a8;
  --ink: #0b1030; --ink-muted: #414a78; --ink-faint: #5a6391;
  --cyan: #00c8e8; --magenta: #f01fc8; --cyan-ink: #00657d; --magenta-ink: #a8008a;
  --cyan-tint: rgba(0, 101, 125, 0.08); --magenta-tint: rgba(168, 0, 138, 0.08);
  --on-accent: #02101a; --success: #00704f; --warning: #7f5400; --danger: #c4003a;
  --glow-cyan: 0 0 0 1px rgba(0, 101, 125, 0.60), 0 4px 14px rgba(0, 200, 232, 0.28);
  --glow-magenta: 0 0 0 1px rgba(168, 0, 138, 0.60), 0 4px 14px rgba(240, 31, 200, 0.25);
  --elevation: 0 12px 28px rgba(11, 16, 48, 0.16);
}
:root[data-theme="dark"] {
  --bg: #05060d; --surface: #0b0e1a; --surface-raised: #121629; --surface-overlay: #1a2040;
  --scrim: rgba(2, 3, 8, 0.72); --line: #262d52; --line-strong: #6370b6;
  --ink: #e8ecff; --ink-muted: #9ca5d4; --ink-faint: #8089bd;
  --cyan: #00e5ff; --magenta: #ff2bd6; --cyan-ink: #19e6ff; --magenta-ink: #ff6be2;
  --cyan-tint: rgba(0, 229, 255, 0.10); --magenta-tint: rgba(255, 43, 214, 0.12);
  --on-accent: #02101a; --success: #2de2a6; --warning: #ffc233; --danger: #ff6482;
  --glow-cyan: 0 0 0 1px rgba(0, 229, 255, 0.55), 0 0 18px rgba(0, 229, 255, 0.30);
  --glow-magenta: 0 0 0 1px rgba(255, 43, 214, 0.55), 0 0 18px rgba(255, 43, 214, 0.30);
  --elevation: 0 12px 32px rgba(0, 0, 0, 0.55);
}

/* Components — subset of the Sam Unified UI component stylesheet */
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 14px/20px var(--font-sans); -webkit-font-smoothing: antialiased; }
:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
.signal { background: linear-gradient(90deg, var(--cyan), var(--magenta)); }
.mono { font: 400 13px/18px var(--font-mono); }
.mono-sm { font: 500 11.5px/16px var(--font-mono); letter-spacing: 0.02em; }
.muted { color: var(--ink-muted); }
.row { display: flex; flex-wrap: wrap; gap: var(--space-2); align-items: center; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2); height: var(--control-md); padding: 0 var(--space-4); border: 1px solid var(--line-strong); border-radius: var(--radius-md); background: transparent; color: var(--ink); font: 600 11px/14px var(--font-display); letter-spacing: 0.14em; text-transform: uppercase; cursor: pointer; white-space: nowrap; transition: box-shadow var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out), background var(--dur-fast) var(--ease-out); }
.btn:hover { border-color: var(--cyan-ink); color: var(--cyan-ink); background: var(--cyan-tint); }
.btn--primary { background: var(--cyan); border-color: var(--cyan-ink); color: var(--on-accent); }
.btn--primary:hover { background: var(--cyan); color: var(--on-accent); box-shadow: var(--glow-cyan); }
.btn--ghost { border-color: transparent; color: var(--ink-muted); }
.btn--danger { border-color: var(--danger); color: var(--danger); }
.btn--danger:hover { border-color: var(--danger); color: var(--danger); background: transparent; box-shadow: 0 0 0 1px var(--danger); }
.btn--sm { height: var(--control-sm); padding: 0 var(--space-3); }
.btn--lg { height: var(--control-lg); padding: 0 var(--space-5); }
.btn:disabled, .btn:disabled:hover { color: var(--ink-faint); border-color: var(--line); background: transparent; box-shadow: none; cursor: not-allowed; }

.field { display: flex; flex-direction: column; gap: var(--space-1); }
.field > span { font: 600 11px/14px var(--font-display); letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-muted); }
.field__help { margin: 0; font: 400 12.5px/18px var(--font-sans); color: var(--ink-muted); }
.input { height: var(--control-md); padding: 0 var(--space-3); background: var(--surface); color: var(--ink); border: 1px solid var(--line-strong); border-radius: var(--radius-md); font: 400 14px/20px var(--font-sans); min-width: 0; transition: box-shadow var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out); }
.input--mono { font: 400 13px/18px var(--font-mono); }
.input--sm { height: var(--control-sm); padding: 0 var(--space-2); font-size: 12px; }
.input::placeholder { color: var(--ink-faint); }
.input:hover { border-color: var(--cyan-ink); }
.input:focus { outline: none; border-color: var(--cyan-ink); box-shadow: var(--glow-cyan); }
.input[aria-invalid="true"] { border-color: var(--danger); }
textarea.input { height: auto; padding: var(--space-2) var(--space-3); resize: vertical; }
select.input { cursor: pointer; }

.toggle { display: inline-flex; align-items: center; gap: var(--space-2); cursor: pointer; color: var(--ink); }
.toggle input { appearance: none; -webkit-appearance: none; margin: 0; position: relative; width: 36px; height: 20px; flex: none; border: 1px solid var(--line-strong); border-radius: var(--radius-pill); background: var(--surface); cursor: pointer; transition: background var(--dur-base) var(--ease-out), border-color var(--dur-base) var(--ease-out); }
.toggle input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 12px; height: 12px; border-radius: var(--radius-pill); background: var(--ink-muted); transition: transform var(--dur-base) var(--ease-out), background var(--dur-base) var(--ease-out); }
.toggle input:checked { background: var(--cyan); border-color: var(--cyan-ink); }
.toggle input:checked::after { transform: translateX(16px); background: var(--on-accent); }
.toggle input:hover { box-shadow: var(--glow-cyan); }

.panel { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: var(--space-4); }
.panel--raised { background: var(--surface-raised); }
.panel__title { display: flex; justify-content: space-between; align-items: center; gap: var(--space-2); margin: 0 0 var(--space-3); font: 600 11px/14px var(--font-display); letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-muted); }
.panel--bracket::before, .panel--bracket::after { content: ""; position: absolute; width: 14px; height: 14px; border: 2px solid var(--cyan-ink); pointer-events: none; }
.panel--bracket::before { top: -1px; left: -1px; border-right: 0; border-bottom: 0; border-top-left-radius: var(--radius-lg); }
.panel--bracket::after { bottom: -1px; right: -1px; border-left: 0; border-top: 0; border-bottom-right-radius: var(--radius-lg); border-color: var(--magenta-ink); }
.stat { font: 700 28px/32px var(--font-display); letter-spacing: 0.04em; color: var(--ink); }
.stat__unit { font: 500 11.5px/16px var(--font-mono); color: var(--ink-muted); margin-left: var(--space-1); }

.badge { display: inline-flex; align-items: center; gap: 6px; height: 20px; padding: 0 var(--space-2); border: 1px solid currentColor; border-radius: var(--radius-sm); font: 500 11.5px/16px var(--font-mono); letter-spacing: 0.02em; text-transform: uppercase; color: var(--ink-muted); white-space: nowrap; }
.badge::before { content: ""; width: 6px; height: 6px; border-radius: var(--radius-pill); background: currentColor; }
.badge--cyan { color: var(--cyan-ink); background: var(--cyan-tint); }
.badge--magenta { color: var(--magenta-ink); background: var(--magenta-tint); }
.badge--success { color: var(--success); }
.badge--warning { color: var(--warning); }
.badge--danger { color: var(--danger); }

.tabs { display: flex; gap: var(--space-1); border-bottom: 1px solid var(--line); padding: 0 var(--space-2); }
.tab { position: relative; height: var(--control-md); padding: 0 var(--space-4); background: transparent; border: 0; color: var(--ink-muted); font: 600 11px/14px var(--font-display); letter-spacing: 0.14em; text-transform: uppercase; cursor: pointer; transition: color var(--dur-fast) var(--ease-out); }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--cyan-ink); }
.tab[aria-selected="true"]::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: linear-gradient(90deg, var(--cyan), var(--magenta)); }

.table { width: 100%; border-collapse: collapse; font: 500 11.5px/16px var(--font-mono); letter-spacing: 0.02em; color: var(--ink); }
.table th { text-align: left; padding: var(--space-2) var(--space-3); border-bottom: 1px solid var(--line-strong); font: 600 11px/14px var(--font-display); letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-muted); white-space: nowrap; }
.table td { padding: var(--space-2) var(--space-3); border-bottom: 1px solid var(--line); vertical-align: top; }
.table tbody tr:hover { background: var(--surface-raised); }
.table tbody tr[aria-selected="true"] { background: var(--surface-overlay); box-shadow: inset 0 0 0 1px var(--cyan-ink); }
.table .num { text-align: right; white-space: nowrap; }

.alert { display: flex; gap: var(--space-3); align-items: flex-start; padding: var(--space-3) var(--space-4); background: var(--surface-raised); border: 1px solid var(--line-strong); border-radius: var(--radius-lg); color: var(--ink); }
.alert__icon { flex: none; width: 20px; height: 20px; display: grid; place-items: center; border: 1px solid currentColor; border-radius: var(--radius-sm); font: 700 12px/1 var(--font-mono); }
.alert__title { font: 600 14px/20px var(--font-sans); }
.alert__body { font: 400 12.5px/18px var(--font-sans); color: var(--ink-muted); }
.alert--info .alert__icon { color: var(--cyan-ink); } .alert--info { background: var(--cyan-tint); border-color: var(--cyan-ink); }
.alert--success .alert__icon { color: var(--success); } .alert--success { border-color: var(--success); }
.alert--warning .alert__icon { color: var(--warning); } .alert--warning { border-color: var(--warning); }
.alert--danger .alert__icon { color: var(--danger); } .alert--danger { border-color: var(--danger); }

/* App layout */
.app { display: grid; grid-template-rows: var(--titlebar) 1fr var(--statusbar); height: 100vh; }
.titlebar { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); padding: 0 var(--space-3); background: var(--surface); border-bottom: 1px solid var(--line); font: 600 11px/14px var(--font-display); letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-muted); }
.brand { display: flex; align-items: center; gap: var(--space-2); color: var(--ink); }
.brand__mark { width: 14px; height: 14px; border-radius: var(--radius-sm); background: linear-gradient(135deg, var(--cyan), var(--magenta)); }
.statusbar { display: flex; align-items: center; gap: var(--space-4); padding: 0 var(--space-3); background: var(--surface); border-top: 1px solid var(--line); font: 500 11.5px/16px var(--font-mono); color: var(--ink-muted); overflow: hidden; white-space: nowrap; }
.main { display: grid; grid-template-columns: minmax(320px, 400px) minmax(0, 1fr); gap: var(--space-5); padding: var(--space-5); overflow: hidden; background-image: radial-gradient(var(--line) 1px, transparent 1px); background-size: var(--space-5) var(--space-5); }
.col { display: flex; flex-direction: column; gap: var(--space-4); overflow-y: auto; min-width: 0; padding: 2px; }
@media (max-width: 900px) {
  .app { height: auto; min-height: 100vh; }
  .main { grid-template-columns: minmax(0, 1fr); overflow: visible; padding: var(--space-4); }
  .col { overflow: visible; }
}
#blob { width: 100%; min-height: 220px; font-size: 12px; line-height: 17px; }
.drop { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--space-1); min-height: 72px; padding: var(--space-3); border: 1px dashed var(--line-strong); border-radius: var(--radius-md); color: var(--ink-muted); text-align: center; cursor: pointer; transition: border-color var(--dur-fast) var(--ease-out), background var(--dur-fast) var(--ease-out); }
.drop:hover, .drop.is-over { border-color: var(--cyan-ink); background: var(--cyan-tint); color: var(--ink); }
.drop u { color: var(--cyan-ink); }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--space-4); }
@media (max-width: 1100px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.stats .panel { padding: var(--space-3) var(--space-4); }
.stats .panel__title { margin-bottom: var(--space-1); }
.flaglist { margin: var(--space-2) 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: var(--space-1); }
.flaglist li { display: flex; gap: var(--space-2); align-items: baseline; font: 400 12.5px/18px var(--font-sans); color: var(--ink); }
.flaglist .when { font: 500 11.5px/16px var(--font-mono); color: var(--ink-muted); white-space: nowrap; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--cyan-ink); font: inherit; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
.out { display: flex; flex-direction: column; min-height: 0; padding: 0; }
.out__bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--space-2); padding: var(--space-3) var(--space-4); border-bottom: 1px solid var(--line); }
.out__body { padding: var(--space-4); overflow-x: auto; }
.glyph { display: inline-grid; place-items: center; width: 16px; height: 16px; flex: none; border: 1px solid currentColor; border-radius: var(--radius-sm); font: 700 10px/1 var(--font-mono); }
.lv-error { color: var(--danger); } .lv-warn { color: var(--warning); } .lv-info { color: var(--cyan-ink); } .lv-ok { color: var(--success); }

/* Month grid (mirrors the centre's sheet) */
.sheet { border-collapse: collapse; width: 100%; min-width: 760px; table-layout: fixed; font: 500 11.5px/16px var(--font-mono); }
.sheet th, .sheet td { border: 1px solid var(--line); padding: var(--space-1) var(--space-2); vertical-align: top; }
.sheet th { font: 600 11px/14px var(--font-display); letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-muted); background: var(--surface-raised); text-align: center; }
.sheet .lbl { width: 92px; color: var(--ink-muted); font: 500 11px/14px var(--font-mono); }
.sheet .wk { width: 92px; }
.sheet .date { text-align: right; color: var(--ink-muted); }
.sheet .date.ph { color: var(--warning); }
.sheet .sess { white-space: pre-wrap; height: 44px; cursor: copy; }
.sheet .sess:hover { background: var(--cyan-tint); }
.sheet .tot td, .sheet .tot { background: var(--surface-raised); text-align: right; }
.sheet .void { background: repeating-linear-gradient(135deg, transparent 0 6px, var(--surface-overlay) 6px 7px); }
.sheet .has-warn { box-shadow: inset 0 0 0 1px var(--warning); }
.sheet .has-error { box-shadow: inset 0 0 0 1px var(--danger); }
.sheet .grand td { font-weight: 600; color: var(--ink); text-align: right; background: var(--surface-overlay); }

/* Sessions review */
.sess-table td.time { white-space: nowrap; }
.sess-table input[type="time"] { width: 124px; }
.sess-table tr.is-off td { color: var(--ink-faint); }
.sess-table tr.is-off td.amt { text-decoration: line-through; }
.notes { display: flex; flex-direction: column; gap: 2px; font: 400 12px/16px var(--font-sans); }
.notes div { display: flex; gap: var(--space-1); align-items: baseline; }
.notes .resolved { color: var(--ink-faint); }
.sub { display: block; color: var(--ink-muted); font: 400 11.5px/16px var(--font-sans); }
pre.text { margin: 0; white-space: pre-wrap; font: 400 12.5px/20px var(--font-mono); color: var(--ink); }

/* Settings */
details.panel > summary { cursor: pointer; list-style: none; margin: 0; }
details.panel > summary::-webkit-details-marker { display: none; }
details.panel > summary::after { content: "+"; font-family: var(--font-mono); }
details.panel[open] > summary { margin-bottom: var(--space-3); }
details.panel[open] > summary::after { content: "−"; }
.set-sec { display: flex; flex-direction: column; gap: var(--space-2); padding: var(--space-3) 0; border-top: 1px solid var(--line); }
.set-sec h3 { margin: 0; font: 600 11px/14px var(--font-display); letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-muted); }
.rate-row { display: grid; grid-template-columns: 1fr 76px 24px; gap: var(--space-2); align-items: center; }
.rule { display: flex; flex-direction: column; gap: var(--space-2); padding: var(--space-3); background: var(--surface-raised); border: 1px solid var(--line); border-radius: var(--radius-md); }
.rule .row > .input { flex: 1 1 90px; }
.rule .input--num { flex: 0 0 64px; width: 64px; }
.rule .hint { font: 400 12px/16px var(--font-sans); color: var(--ink-muted); }
.x { width: 24px; height: 24px; display: grid; place-items: center; background: none; border: 1px solid transparent; border-radius: var(--radius-md); color: var(--ink-muted); cursor: pointer; font: 500 12px/1 var(--font-mono); }
.x:hover { border-color: var(--danger); color: var(--danger); }
.add-form { display: flex; flex-wrap: wrap; gap: var(--space-2); align-items: flex-end; padding-top: var(--space-4); }
.add-form .field { min-width: 0; }
</style>
</head>
<body>
<div class="app">
  <header class="titlebar">
    <div class="brand"><span class="brand__mark" aria-hidden="true"></span><span>Educare4u Timesheet</span></div>
    <div class="row">
      <span class="mono-sm" id="tb-month"></span>
      <button class="btn btn--ghost btn--sm" id="theme-btn" type="button">Light</button>
    </div>
  </header>

  <main class="main">
    <section class="col" aria-label="Inputs">
      <div class="panel panel--bracket">
        <h2 class="panel__title"><span>1 · Calendar</span><span class="mono-sm" id="blob-meta"></span></h2>
        <textarea id="blob" class="input input--mono" spellcheck="false" placeholder="Paste the month from Google Calendar (schedule view)…"></textarea>
        <div class="row" style="margin-top: var(--space-2)">
          <button class="btn btn--sm" type="button" data-act="sample">Load Aug sample</button>
          <button class="btn btn--sm btn--ghost" type="button" data-act="clear-blob">Clear</button>
        </div>
        <p class="field__help" style="margin-top: var(--space-2)">Results update as you type. Duplicate Zoom entries are merged automatically.</p>
      </div>

      <div class="panel">
        <h2 class="panel__title"><span>2 · Centre template</span><span id="tpl-badge"></span></h2>
        <label class="drop" id="drop">
          <input type="file" accept=".xlsx" id="tpl-file" hidden>
          <span>Drop the blank .xlsx here or <u>browse</u></span>
          <span class="field__help">Optional. Needed to download the filled workbook.</span>
        </label>
        <div id="tpl-info" style="margin-top: var(--space-3)"></div>
      </div>

      <details class="panel" id="settings">
        <summary class="panel__title">Settings · rates · rules</summary>
        <div id="settings-body"></div>
      </details>
    </section>

    <section class="col" aria-label="Results">
      <div class="stats" id="stats"></div>
      <div id="flags"></div>
      <div class="panel out">
        <div class="tabs" role="tablist" id="tabs">
          <button class="tab" role="tab" data-tab="grid">Timesheet</button>
          <button class="tab" role="tab" data-tab="sessions">Sessions</button>
          <button class="tab" role="tab" data-tab="text">Text</button>
        </div>
        <div class="out__bar" id="out-bar"></div>
        <div class="out__body" id="out-body"></div>
      </div>
    </section>
  </main>

  <footer class="statusbar"><span id="status">Ready</span></footer>
</div>

<!-- ─── Core logic: pure, no DOM. Tested by tests/core.test.mjs ─────────────── -->
<script id="core">
globalThis.TimesheetCore = (() => {
  'use strict';

  const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  const WEEKDAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  const LONG_SESSION_MINS = 180; // longer than this with no rule → flag

  // Singapore gazetted public holidays 2026 (MOM). Editable in Settings.
  const SG_HOLIDAYS = [
    '2026-01-01 New Year\'s Day',
    '2026-02-17 Chinese New Year',
    '2026-02-18 Chinese New Year',
    '2026-03-21 Hari Raya Puasa',
    '2026-04-03 Good Friday',
    '2026-05-01 Labour Day',
    '2026-05-27 Hari Raya Haji',
    '2026-05-31 Vesak Day',
    '2026-06-01 Vesak Day (observed)',
    '2026-08-09 National Day',
    '2026-08-10 National Day (observed)',
    '2026-11-08 Deepavali',
    '2026-11-09 Deepavali (observed)',
    '2026-12-25 Christmas Day',
  ].join('\n');

  const DEFAULT_SETTINGS = {
    tutor: 'Sam',
    defaultRate: 35,
    rates: [
      { name: 'Farah', rate: 40 }, { name: 'Gavin', rate: 40 }, { name: 'Hana', rate: 35 },
      { name: 'Ivan', rate: 35 }, { name: 'Jade', rate: 35 }, { name: 'Mei Mei', rate: 35 },
      { name: 'Leo', rate: 35 }, { name: 'Noah', rate: 35 },
    ],
    rules: [
      { id: 1, label: 'Noah 30-min break', type: 'break_over', student: 'Noah', minHours: 3, breakMins: 30 },
      { id: 2, label: 'Farah long session split', type: 'exact_hours', student: 'Farah', minHours: 6, billHours: 2, breakHours: 1 },
      { id: 3, label: 'Lunch 10am–3pm', type: 'window', student: '', start: '10:00', end: '15:00', breakMins: 60 },
      { id: 4, label: 'Lunch 10am–4pm', type: 'window', student: '', start: '10:00', end: '16:00', breakMins: 120 },
    ],
    holidays: SG_HOLIDAYS,
    markPH: true,
  };

  // ── Formatting ────────────────────────────────────────────────────────────
  const pad = n => String(n).padStart(2, '0');
  const hhmm = mins => pad(Math.floor(mins / 60)) + ':' + pad(mins % 60);
  const iso = (y, m, d) => `${y}-${pad(m + 1)}-${pad(d)}`;
  function toMins(s) {
    const m = /^(\d{1,2}):(\d{2})$/.exec(String(s == null ? '' : s).trim());
    if (!m || +m[1] > 24 || +m[2] > 59) return NaN;
    return +m[1] * 60 + +m[2];
  }
  function fmtTime(mins, withSuffix) {
    const h = Math.floor(mins / 60) % 24, m = mins % 60;
    const dh = h === 0 ? 12 : h > 12 ? h - 12 : h;
    const base = m === 0 ? String(dh) : `${dh}.${pad(m)}`;
    return withSuffix ? base + (h >= 12 ? 'pm' : 'am') : base;
  }
  function fmtRange(s, e) {
    const same = (Math.floor(s / 60) % 24 >= 12) === (Math.floor(e / 60) % 24 >= 12);
    return `${fmtTime(s, !same)}–${fmtTime(e, true)}`;
  }
  function fmtHrs(mins) {
    const h = mins / 60;
    return Number.isInteger(Math.round(h * 1000) / 100) ? h.toFixed(1) : h.toFixed(2);
  }
  function fmtMoney(cents) {
    return '$' + (cents / 100).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  const shortDate = (y, m, d) => `${d} ${MONTHS[m].slice(0, 3)}, ${WEEKDAYS[new Date(y, m, d).getDay()].slice(0, 3)}`;

  // ── Parsing ───────────────────────────────────────────────────────────────
  const DAYNUM_RE = /^(\d{1,2})$/;
  const DATEHDR_RE = /^([A-Za-z]{3,9})\.?\s+(\d{4}),\s*([A-Za-z]{3,9})\.?$/;
  const ALLDAY_RE = /^all[\s-]?day$/i;
  const TIME_RE = /^(\d{1,2})(?::(\d{2}))?\s*(am|pm)?\s*[–—-]\s*(\d{1,2})(?::(\d{2}))?\s*(am|pm)?$/i;

  const monthIndex = tok => MONTHS.findIndex(n => n.slice(0, 3).toLowerCase() === String(tok).slice(0, 3).toLowerCase());
  const weekdayIndex = tok => WEEKDAYS.findIndex(n => n.slice(0, 3).toLowerCase() === String(tok).slice(0, 3).toLowerCase());

  function parseTimeLine(line) {
    const m = TIME_RE.exec(line);
    if (!m) return null;
    let [, h1, m1, s1, h2, m2, s2] = m;
    // 24-hour form must have minutes on both sides ("12:00 – 13:30")
    if (!s1 && !s2 && (m1 == null || m2 == null)) return null;
    const conv = (h, mm, suf) => {
      h = +h; mm = +(mm || 0);
      if (suf) h = (h % 12) + (suf.toLowerCase() === 'pm' ? 12 : 0);
      return h * 60 + mm;
    };
    let start, end = conv(h2, m2, s2 || s1);
    if (!s1 && s2) {
      start = conv(h1, m1, s2);
      if (start > end) start = conv(h1, m1, 'am');
    } else start = conv(h1, m1, s1);
    if (start > 24 * 60 || end > 24 * 60) return null;
    return { start, end };
  }

  function parseBlob(text) {
    const lines = String(text || '').replace(/\r/g, '').split('\n').map(l => l.trim());
    const days = [], unparsed = [];
    const isHdr = k => DAYNUM_RE.test(lines[k]) && k + 1 < lines.length && DATEHDR_RE.test(lines[k + 1]);
    const isEventStart = k => !!parseTimeLine(lines[k]) || ALLDAY_RE.test(lines[k]);
    let cur = null, i = 0;
    while (i < lines.length) {
      const line = lines[i];
      if (!line) { i++; continue; }
      if (isHdr(i)) {
        const m = DATEHDR_RE.exec(lines[i + 1]);
        cur = { day: +line, month: monthIndex(m[1]), year: +m[2], weekday: weekdayIndex(m[3]), header: `${line} ${lines[i + 1]}`, lineNo: i + 1, events: [] };
        days.push(cur);
        i += 2;
        continue;
      }
      if (cur && isEventStart(i)) {
        const lineNo = i + 1;
        const t = parseTimeLine(line);
        i++;
        let title = '';
        if (i < lines.length && lines[i] && !isHdr(i) && !isEventStart(i)) title = lines[i++];
        const details = [];
        while (i < lines.length && lines[i] && !isHdr(i) && !isEventStart(i)) details.push(lines[i++]);
        cur.events.push({ start: t ? t.start : null, end: t ? t.end : null, allDay: !t, title, details, lineNo });
        continue;
      }
      unparsed.push({ lineNo: i + 1, text: line });
      i++;
    }
    return { days, unparsed };
  }

  // ── Student identification ────────────────────────────────────────────────
  const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const LEVEL_RE = /\b(?:sec(?:ondary)?\s*\d|s[1-5]\b|p(?:ri(?:mary)?)?\s*[1-6]\b|primary\b|jc\s*[12]?\b|j[12]\b|[ao][\s-]?levels?\b|ip\b|ib\b|igcse\b|y(?:ea)?r\s*\d|grade\s*\d)/i;

  function cleanTitle(title, tutor) {
    let t = String(title || '').replace(/^educare\s*4\s*u\b[\s:\-–|]*/i, '');
    t = t.split('|')[0];
    if (tutor) t = t.replace(new RegExp('\\bx\\s+' + escRe(tutor) + '\\b', 'ig'), ' ');
    return t.replace(/^\s*x\s+/i, '').replace(/\s+/g, ' ').trim();
  }

  function identifyStudent(title, roster, tutor) {
    const t = cleanTitle(title, tutor);
    const names = roster.filter(Boolean).slice().sort((a, b) => b.length - a.length);
    for (const n of names) {
      if (new RegExp('^' + escRe(n) + '(?![A-Za-z])', 'i').test(t)) return { name: n, known: true, rest: t.slice(n.length).trim() };
    }
    const lv = LEVEL_RE.exec(t);
    if (lv && lv.index > 0) return { name: t.slice(0, lv.index).trim(), known: false, rest: t.slice(lv.index).trim() };
    const [first = '', ...rest] = t.split(' ');
    return { name: first, known: false, rest: rest.join(' ') };
  }

  function parseHolidays(text) {
    const map = new Map();
    for (const line of String(text || '').split('\n')) {
      const m = /^\s*(\d{4})-(\d{2})-(\d{2})\s*(.*)$/.exec(line);
      if (m) map.set(`${m[1]}-${m[2]}-${m[3]}`, m[4].trim() || 'Public holiday');
    }
    return map;
  }

  // ── Billing ───────────────────────────────────────────────────────────────
  const sameName = (a, b) => String(a || '').trim().toLowerCase() === String(b || '').trim().toLowerCase();

  // Precedence: named-student window/split rules, then generic ones, then the "break if long" fallbacks.
  function findRule(student, start, end, rules) {
    const named = r => !!String(r.student || '').trim();
    const dur = end - start;
    const hit = r => r.type === 'window' ? toMins(r.start) === start && toMins(r.end) === end
      : r.type === 'exact_hours' ? dur === Math.round(Number(r.minHours) * 60)
      : r.type === 'break_over' ? dur >= Math.round(Number(r.minHours) * 60) : false;
    const rank = r => (r.type === 'break_over' ? 2 : 0) + (named(r) ? 0 : 1);
    return (rules || []).filter(r => (!named(r) || sameName(r.student, student)) && hit(r))
      .sort((a, b) => rank(a) - rank(b))[0] || null;
  }

  // Returns segments; billed segments carry minutes billed.
  function billSegments(start, end, rule) {
    const dur = end - start;
    if (!rule) return [{ type: 'billed', start, end, mins: dur }];
    if (rule.type === 'exact_hours') {
      const b = Math.round(Number(rule.billHours) * 60), br = Math.round(Number(rule.breakHours) * 60);
      const segs = [
        { type: 'billed', start, end: start + b, mins: b },
        { type: 'break', start: start + b, end: start + b + br },
        { type: 'billed', start: start + b + br, end: start + 2 * b + br, mins: b },
      ];
      if (start + 2 * b + br < end) segs.push({ type: 'foc', start: start + 2 * b + br, end });
      return segs;
    }
    return [{ type: 'billed', start, end, mins: Math.max(0, dur - Math.round(Number(rule.breakMins) || 0)) }];
  }

  function segmentText(seg, student, rateCents) {
    if (seg.type === 'billed') return `${fmtRange(seg.start, seg.end)} (${fmtHrs(seg.mins)} hrs) ${student}: ${fmtMoney(Math.round(rateCents * seg.mins / 60))}`;
    if (seg.type === 'break') return `${fmtRange(seg.start, seg.end)} (break, unbilled)`;
    return `${fmtRange(seg.start, seg.end)} (FOC)`;
  }

  function ruleText(r) {
    if (r.type === 'window') return `${r.start}–${r.end} exactly: deduct ${r.breakMins} min break`;
    if (r.type === 'exact_hours') return `${r.minHours} h exactly: bill ${r.billHours} h, ${r.breakHours} h break, bill ${r.billHours} h, rest FOC`;
    return `${r.minHours} h or longer: deduct ${r.breakMins} min break`;
  }

  // ── Main pipeline ─────────────────────────────────────────────────────────
  function withDefaults(s) {
    s = s || {};
    return {
      tutor: s.tutor != null ? String(s.tutor).trim() : DEFAULT_SETTINGS.tutor,
      defaultRate: Number.isFinite(Number(s.defaultRate)) && s.defaultRate !== '' ? Number(s.defaultRate) : DEFAULT_SETTINGS.defaultRate,
      rates: Array.isArray(s.rates) ? s.rates : DEFAULT_SETTINGS.rates,
      rules: Array.isArray(s.rules) ? s.rules : DEFAULT_SETTINGS.rules,
      holidays: s.holidays != null ? s.holidays : DEFAULT_SETTINGS.holidays,
      markPH: s.markPH != null ? !!s.markPH : DEFAULT_SETTINGS.markPH,
    };
  }

  function run({ blob = '', settings, overrides = {}, manual = [] } = {}) {
    const S = withDefaults(settings);
    const roster = S.rates.map(r => String(r.name || '').trim()).filter(Boolean);
    const holidays = parseHolidays(S.holidays);
    const flags = [];
    const ignored = [];
    const parsed = parseBlob(blob);

    if (parsed.unparsed.length) {
      const ex = parsed.unparsed.slice(0, 2).map(u => `line ${u.lineNo}: "${u.text.slice(0, 40)}"`).join('; ');
      flags.push({ level: 'warn', text: `${parsed.unparsed.length} line(s) not recognised and skipped (${ex}). Check the paste is complete.` });
    }
    for (const d of parsed.days) {
      if (d.month < 0 || d.weekday < 0) flags.push({ level: 'error', text: `Could not read the date header "${d.header}" (line ${d.lineNo}).` });
    }

    // Month = the one most days belong to (manual entries only count when the paste has no dates)
    const tally = new Map();
    const bump = (y, m) => { if (m >= 0 && y) tally.set(y * 12 + m, (tally.get(y * 12 + m) || 0) + 1); };
    parsed.days.forEach(d => bump(d.year, d.month));
    if (!tally.size) manual.forEach(s => { const p = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s.date || ''); if (p) bump(+p[1], +p[2] - 1); });
    if (!tally.size) {
      if (String(blob).trim()) flags.push({ level: 'error', text: 'No dates found. Paste the month from Google Calendar\'s schedule view (day number, then "Aug 2026, Wed").' });
      return { empty: true, flags, sessions: [], ignored, counts: countFlags(flags, []) };
    }
    const key = [...tally.entries()].sort((a, b) => b[1] - a[1] || a[0] - b[0])[0][0];
    const y = Math.floor(key / 12), m = key % 12, dim = new Date(y, m + 1, 0).getDate();
    const monthLabel = `${MONTHS[m]} ${y}`;

    const offMonth = parsed.days.filter(d => d.month >= 0 && (d.year !== y || d.month !== m));
    if (offMonth.length) flags.push({ level: 'warn', text: `Skipped ${offMonth.length} day(s) outside ${monthLabel}: ${offMonth.map(d => `${d.day} ${MONTHS[d.month].slice(0, 3)}`).join(', ')}.` });

    // Collect Educare4u events for the month
    const raw = [];
    const badWeekday = new Set();
    for (const d of parsed.days) {
      if (d.year !== y || d.month !== m) continue;
      if (d.day < 1 || d.day > dim) { flags.push({ level: 'error', text: `${d.day} ${MONTHS[m]} does not exist (line ${d.lineNo}).` }); continue; }
      const actualWd = new Date(y, m, d.day).getDay();
      if (d.weekday >= 0 && d.weekday !== actualWd) {
        badWeekday.add(d.day);
        flags.push({ level: 'error', text: `"${d.header}" says ${WEEKDAYS[d.weekday].slice(0, 3)}, but ${d.day} ${MONTHS[m].slice(0, 3)} ${y} is a ${WEEKDAYS[actualWd]}. Check the paste.` });
      }
      for (const ev of d.events) {
        const isE4U = /^educare\s*4\s*u\b/i.test(ev.title);
        if (!isE4U) { ignored.push({ d: d.day, time: ev.allDay ? 'all day' : fmtRange(ev.start, ev.end), title: ev.title || '(no title)' }); continue; }
        if (ev.allDay) { flags.push({ level: 'warn', text: `${shortDate(y, m, d.day)}: all-day event "${ev.title}" skipped (no times).` }); continue; }
        const who = identifyStudent(ev.title, roster, S.tutor);
        raw.push({ d: d.day, start: ev.start, end: ev.end, title: ev.title, details: ev.details, who });
      }
    }

    // Group per day + student, then merge overlapping entries (Zoom link copy + "Zoom" copy, etc.)
    const groups = new Map();
    for (const ev of raw) {
      const k = ev.d + '|' + ev.who.name.toLowerCase();
      if (!groups.has(k)) groups.set(k, []);
      groups.get(k).push(ev);
    }
    const drafts = [];
    for (const evs of groups.values()) {
      evs.sort((a, b) => a.start - b.start || a.end - b.end);
      const clusters = [];
      for (const ev of evs) {
        const c = clusters[clusters.length - 1];
        if (c && ev.start < c.end) { c.evs.push(ev); c.end = Math.max(c.end, ev.end); }
        else clusters.push({ evs: [ev], end: Math.max(ev.end, ev.start) });
      }
      for (const c of clusters) {
        const first = c.evs[0];
        const cands = [];
        for (const e of c.evs) if (!cands.some(x => x.start === e.start && x.end === e.end)) cands.push({ start: e.start, end: e.end });
        const allDetails = c.evs.flatMap(e => e.details);
        const zoom = allDetails.some(t => /zoom/i.test(t));
        const rests = [...new Set(c.evs.map(e => e.who.rest).filter(Boolean))];
        drafts.push({
          id: `${iso(y, m, first.d)}|${first.who.name}|${hhmm(first.start)}`,
          d: first.d, student: first.who.name, known: first.who.known,
          subject: rests[0] || '', rests,
          format: zoom ? 'Zoom' : 'In person',
          location: zoom ? 'Zoom' : (allDetails.find(t => !/^https?:/i.test(t)) || '').split(',')[0].trim(),
          candidates: cands, sources: c.evs.length,
          cancelled: c.evs.some(e => /\bcancel+ed\b/i.test(e.title)),
          manual: false,
        });
      }
    }
    for (const s of manual) {
      const p = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s.date || '');
      if (!p || +p[1] !== y || +p[2] - 1 !== m) { flags.push({ level: 'warn', text: `Added session ${s.date} ${s.student || ''} is outside ${monthLabel}; ignored.` }); continue; }
      const st = toMins(s.start), en = toMins(s.end);
      const known = roster.find(n => sameName(n, s.student));
      drafts.push({
        id: s.id, d: +p[3], student: known || String(s.student || '').trim() || '?', known: !!known,
        subject: '', rests: [], format: '', location: '',
        candidates: [{ start: st, end: en }], sources: 0, cancelled: false, manual: true,
      });
    }

    // Apply overrides, rules and flags
    const sessions = drafts.map(dr => {
      const ov = overrides[dr.id] || {};
      const f = [];
      const choice = Number.isInteger(ov.choice) && ov.choice >= 0 && ov.choice < dr.candidates.length ? ov.choice : 0;
      const cal = dr.candidates[choice];
      let start = cal.start, end = cal.end;
      const edited = !dr.manual && ov.start != null && ov.end != null && Number.isFinite(toMins(ov.start)) && Number.isFinite(toMins(ov.end))
        && (toMins(ov.start) !== cal.start || toMins(ov.end) !== cal.end);
      if (edited) { start = toMins(ov.start); end = toMins(ov.end); }
      const include = ov.include != null ? !!ov.include : !dr.cancelled;
      const valid = Number.isFinite(start) && Number.isFinite(end) && end > start;
      const dateIso = iso(y, m, dr.d);

      if (!valid) f.push({ level: 'error', text: 'End time must be after start time.' });
      if (badWeekday.has(dr.d)) f.push({ level: 'error', text: 'Date header weekday does not match the calendar.' });
      if (dr.candidates.length > 1) {
        const opts = dr.candidates.map(c => fmtRange(c.start, c.end)).join(' vs ');
        if (Number.isInteger(ov.choice)) f.push({ level: 'info', text: `Calendar had different times (${opts}). You picked ${fmtRange(cal.start, cal.end)}.` });
        else f.push({ level: 'warn', text: `Calendar has different times for this lesson (${opts}). Assumed ${fmtRange(cal.start, cal.end)}. Pick the right one.` });
      }
      if (dr.sources > 1) f.push({ level: 'info', text: `Merged ${dr.sources} calendar entries into one lesson.` });
      if (dr.rests.length > 1) f.push({ level: 'info', text: `Titles differ: ${dr.rests.join(' / ')}.` });
      if (!dr.known) f.push({ level: 'warn', text: `"${dr.student}" is not in the rate list. Billed at the default $${S.defaultRate}/hr.` });
      if (dr.cancelled) f.push(include ? { level: 'info', text: 'Title says cancelled, but you included it.' } : { level: 'warn', text: 'Title says cancelled, so it is excluded. Include it if the lesson went ahead.' });
      if (!include && !dr.cancelled) f.push({ level: 'info', text: 'Excluded by you.' });
      if (edited) f.push({ level: 'info', text: `Edited by you (calendar said ${fmtRange(cal.start, cal.end)}).` });
      if (dr.manual) f.push({ level: 'info', text: 'Added by you (not in calendar).' });
      if (valid && (start % 15 || end % 15)) f.push({ level: 'warn', text: `Unusual time ${fmtRange(start, end)} (not on a 15-minute mark).` });
      if (holidays.has(dateIso)) f.push({ level: 'info', text: `Public holiday: ${holidays.get(dateIso)}.` });

      const rateRow = S.rates.find(r => sameName(r.name, dr.student));
      const rate = rateRow && rateRow.rate !== '' && Number.isFinite(Number(rateRow.rate)) ? Number(rateRow.rate) : S.defaultRate;
      const rateCents = Math.round(rate * 100);
      const rule = valid ? findRule(dr.student, start, end, S.rules) : null;
      const segments = valid ? billSegments(start, end, rule) : [];
      const billedMins = segments.filter(s => s.type === 'billed').reduce((a, s) => a + s.mins, 0);
      const cents = segments.filter(s => s.type === 'billed').reduce((a, s) => a + Math.round(rateCents * s.mins / 60), 0);
      if (rule) f.push({ level: 'info', text: `Rule "${rule.label}" applied: ${ruleText(rule)}.` });
      if (valid && !rule && end - start > LONG_SESSION_MINS) f.push({ level: 'warn', text: `Long lesson (${fmtHrs(end - start)} hrs) with no break rule. Check whether a break should be deducted.` });
      if (valid && rule && billedMins <= 0) f.push({ level: 'error', text: 'Break rule leaves nothing to bill.' });

      return {
        id: dr.id, d: dr.d, date: dateIso, label: shortDate(y, m, dr.d), wd: new Date(y, m, dr.d).getDay(),
        student: dr.student, known: dr.known, subject: dr.subject, format: dr.format, location: dr.location,

        include, valid, edited, manual: dr.manual, ack: !!ov.ack, ph: holidays.get(dateIso) || null,
        rate, rule: rule ? rule.label : null, segments, billedMins, grossCents: valid ? cents : 0, cents: include && valid ? cents : 0,

      };
    });
    sessions.sort((a, b) => a.d - b.d || (a.start || 0) - (b.start || 0) || a.student.localeCompare(b.student));

    // Different students at overlapping times on the same day
    const live = sessions.filter(s => s.include && s.valid);
    for (const a of live) for (const b of live) {
      if (a !== b && a.d === b.d && !sameName(a.student, b.student) && a.start < b.end && b.start < a.end) {

      for (const fl of s.flags) fl.resolved = fl.level === 'warn' && s.ack;
      s.status = s.flags.some(x => x.level === 'error') ? 'error' : s.flags.some(x => x.level === 'warn' && !x.resolved) ? 'warn' : 'ok';
    }

    // Day and week aggregation
    const days = [null];
    for (let d = 1; d <= dim; d++) {
      const mine = live.filter(s => s.d === d);
      const ds = sessions.filter(s => s.d === d);
      days.push({
        d, wd: new Date(y, m, d).getDay(), ph: holidays.get(iso(y, m, d)) || null,
        lines: mine.flatMap(s => s.lines), cents: mine.reduce((a, s) => a + s.cents, 0),

    for (let d = 1; d <= dim; d++) {

    return {
      empty: false, y, m, monthName: MONTHS[m], monthLabel, dim, tutor: S.tutor,
      sessions, days, weeks, ignored, flags,

      counts: countFlags(flags, sessions),

  function countFlags(globalFlags, sessions) {
    const c = { error: 0, warn: 0, info: 0 };

  // ── Outputs ───────────────────────────────────────────────────────────────
  // Tab-separated block for Excel: 3 rows per week (dates, lessons, totals) × Mon–Sun.
  // Paste with the first Monday "Date" cell selected (B4 in the centre's template).
  function buildTSV(r, opts = {}) {

    const rows = [];

      rows.push(wk.cells.map(d => d ? r.days[d].lines.join('\n') : ''));

  // Days to label "9 PH" by default: public holidays with a lesson
  const defaultPhDays = r => new Set(r && !r.empty && r.days ? r.days.filter(x => x && x.ph && x.lines.length).map(x => x.d) : []);

  function buildText(r) {
    if (!r || r.empty) return '';

    for (const day of r.days) {
      if (!day || !day.lines.length) continue;
      out.push('', shortDate(r.y, r.m, day.d) + (day.ph ? ` (PH: ${day.ph})` : ''), ...day.lines, fmtMoney(day.cents));
    }
    out.push('', `Final sum: ${fmtMoney(r.totalCents)}`);
    const todo = [
      ...r.flags.filter(f => f.level !== 'info').map(f => f.text),
      ...r.sessions.flatMap(s => s.flags.filter(f => f.level !== 'info' && !f.resolved).map(f => `${s.label} — ${s.student}: ${f.text}`)),
    ];
    if (todo.length) out.push('', 'Verification Needed', ...todo.map((t, i) => `${i + 1}. ${t}`));
    return out.join('\n');
  }

  return {
    MONTHS, WEEKDAYS, DEFAULT_SETTINGS,
    toMins, hhmm, fmtRange, fmtHrs, fmtMoney, shortDate,
    parseBlob, parseTimeLine, cleanTitle, identifyStudent, findRule, billSegments,
    run, buildTSV, buildText, defaultPhDays, withDefaults,
  };
})();

      anchorRef: ref(weeks[0].dateRow, firstDayCol), firstDayCol, lastDayCol,
      formulaCells: [...cells.entries()].filter(([, c]) => c.formula).map(([r]) => r),

  }

      strip(c, ['v', 'is']);
      c.removeAttribute('t');
      if (num == null) { if (kid(c, 'f')) { /* formula recalculates on open */ } return c; }
      const v = doc.createElementNS(NS, 'v');
      v.textContent = String(num);
      const f = kid(c, 'f');
      c.insertBefore(v, f ? f.nextSibling : null);
      return c;
    }
    function rowHeight(r, pts) {
      const el = rowEl(r);
      const cur = parseFloat(el.getAttribute('ht')) || defaultRowHt;
      if (pts > cur + 0.1) { el.setAttribute('ht', String(Math.round(pts * 4) / 4)); el.setAttribute('customHeight', '1'); }
    }
    const fmtPr = all(doc, 'sheetFormatPr')[0];
    const defaultRowHt = fmtPr ? parseFloat(fmtPr.getAttribute('defaultRowHeight')) || 15 : 15;
    const defaultColW = fmtPr && fmtPr.getAttribute('defaultColWidth') ? parseFloat(fmtPr.getAttribute('defaultColWidth')) : 8.43 + 0.71;
    function colWidth(n) {
      const col = all(doc, 'col').find(x => +x.getAttribute('min') <= n && +x.getAttribute('max') >= n);
      return col ? parseFloat(col.getAttribute('width')) : defaultColW;
    }
    function ensureColWidth(n, width) {
      if (colWidth(n) >= width) return;
      let cols = all(doc, 'cols')[0];
      if (!cols) { cols = doc.createElementNS(NS, 'cols'); doc.documentElement.insertBefore(cols, sheetData); }
      const span = kids(cols, 'col').find(x => +x.getAttribute('min') <= n && +x.getAttribute('max') >= n);
      let mine;
      if (span) {
        const lo = +span.getAttribute('min'), hi = +span.getAttribute('max');
        if (lo < n) { const a = span.cloneNode(true); a.setAttribute('max', n - 1); cols.insertBefore(a, span); }
        if (hi > n) { const b = span.cloneNode(true); b.setAttribute('min', n + 1); cols.insertBefore(b, span.nextSibling); }
        span.setAttribute('min', n); span.setAttribute('max', n);
        mine = span;
      } else {
        mine = doc.createElementNS(NS, 'col');
        mine.setAttribute('min', n); mine.setAttribute('max', n);
        const after = kids(cols, 'col').find(x => +x.getAttribute('min') > n) || null;
        cols.insertBefore(mine, after);
      }
      mine.setAttribute('width', String(width));
      mine.setAttribute('customWidth', '1');
    }
    return { cell, setText, setNumber, rowHeight, colWidth, ensureColWidth };
  }

  function styler(doc) {
    const root = doc.documentElement;
    const cellXfs = kid(root, 'cellXfs');
    const fonts = kids(kid(root, 'fonts'), 'font');
    const cache = new Map();
    let fmtId = null, yellowId = null;
    const xf = s => kids(cellXfs, 'xf')[+s || 0] || kids(cellXfs, 'xf')[0];
    function currencyId() {
      if (fmtId != null) return fmtId;
      let numFmts = kid(root, 'numFmts');
      if (!numFmts) { numFmts = doc.createElementNS(NS, 'numFmts'); root.insertBefore(numFmts, root.firstElementChild); }
      const existing = kids(numFmts, 'numFmt').find(n => n.getAttribute('formatCode') === CURRENCY_FMT);
      if (existing) return (fmtId = existing.getAttribute('numFmtId'));
      fmtId = String(Math.max(163, ...kids(numFmts, 'numFmt').map(n => +n.getAttribute('numFmtId'))) + 1);
      const nf = doc.createElementNS(NS, 'numFmt');
      nf.setAttribute('numFmtId', fmtId); nf.setAttribute('formatCode', CURRENCY_FMT);
      numFmts.appendChild(nf);
      numFmts.setAttribute('count', kids(numFmts, 'numFmt').length);
      return fmtId;
    }
    function yellowFillId() {
      if (yellowId != null) return yellowId;
      const fills = kid(root, 'fills');
      const fill = doc.createElementNS(NS, 'fill'), pf = doc.createElementNS(NS, 'patternFill');
      const fg = doc.createElementNS(NS, 'fgColor'), bg = doc.createElementNS(NS, 'bgColor');
      pf.setAttribute('patternType', 'solid'); fg.setAttribute('rgb', 'FFFFFF00'); bg.setAttribute('indexed', '64');
      pf.append(fg, bg); fill.appendChild(pf); fills.appendChild(fill);
      fills.setAttribute('count', kids(fills, 'fill').length);
      return (yellowId = String(kids(fills, 'fill').length - 1));
    }
    function derive(s, { wrap = false, currency = false, yellow = false, right = false } = {}) {
      const key = `${s || 0}|${wrap}|${currency}|${yellow}|${right}`;
      if (cache.has(key)) return cache.get(key);
      const base = xf(s), x = base.cloneNode(true);
      if (currency && (+x.getAttribute('numFmtId') || 0) === 0) { x.setAttribute('numFmtId', currencyId()); x.setAttribute('applyNumberFormat', '1'); }
      if (wrap || right) {
        let al = kid(x, 'alignment');
        if (!al) { al = doc.createElementNS(NS, 'alignment'); x.insertBefore(al, x.firstElementChild); }
        if (wrap) { al.setAttribute('wrapText', '1'); al.setAttribute('vertical', 'top'); }
        if (right && !al.getAttribute('horizontal')) al.setAttribute('horizontal', 'right');
        x.setAttribute('applyAlignment', '1');
      }
      if (yellow) { x.setAttribute('fillId', yellowFillId()); x.setAttribute('applyFill', '1'); }
      let id = String(s || 0);
      if (!x.isEqualNode(base)) {
        cellXfs.appendChild(x);
        cellXfs.setAttribute('count', kids(cellXfs, 'xf').length);
        id = String(kids(cellXfs, 'xf').length - 1);
      }
      cache.set(key, id);
      return id;
    }
    function fontSize(s) {
      const f = fonts[+xf(s).getAttribute('fontId') || 0];
      const sz = f && kid(f, 'sz');
      return sz ? parseFloat(sz.getAttribute('val')) || 11 : 11;
    }
    return { derive, fontSize };
  }

  // Wrapped line count estimate for a cell of `width` character units.
  function wrapLines(text, width) {
    const cap = Math.max(6, Math.floor(width * 1.1));
    let n = 0;
    for (const line of text.split('\n')) {
      let len = 0, lines = 1;
      for (const w of line.split(' ')) {
        if (len === 0) len = w.length;
        else if (len + 1 + w.length <= cap) len += 1 + w.length;
        else { lines++; len = w.length; }
        while (len > cap) { lines++; len -= cap; }
      }
      n += lines;
    }
    return n;
  }

  function phDaysFor(tpl, result, markPH) {
    const set = TimesheetCore.defaultPhDays(result);
    if (!markPH) return new Set();
    if (tpl) for (const d of [...set]) { const info = tpl.layout.days[d]; if (!info || info.dateFormula || info.dateIsText) set.delete(d); }
    return set;
  }

  // Problems that block filling this template with this result
  function check(tpl, result) {
    const L = tpl.layout, out = [...L.problems];
    if (result && !result.empty && L.month >= 0 && L.year != null && (L.month !== result.m || L.year !== result.y)) {
      out.unshift(`Template is for ${TimesheetCore.MONTHS[L.month]} ${L.year}, but the calendar is ${result.monthLabel}.`);
    }
    return out;
  }

  async function fill(tpl, result, { name, markPH }) {
    const L = tpl.layout;
    const sheet = parseXml(tpl.texts.sheet, 'sheet');
    const styles = tpl.texts.styles ? parseXml(tpl.texts.styles, 'styles') : null;
    const wb = parseXml(tpl.texts.workbook, 'workbook');
    const W = sheetWriter(sheet), St = styles ? styler(styles) : null;
    const restyle = (c, opts) => { if (St) c.setAttribute('s', St.derive(c.getAttribute('s'), opts)); };
    const phDays = phDaysFor(tpl, result, markPH);

    if (L.nameRef && name) W.setText(L.nameRef, name);

    for (let col = L.firstDayCol; col <= L.lastDayCol; col++) W.ensureColWidth(col, MIN_DAY_COL_WIDTH);

    const needRows = new Map(); // session row → points
    for (let d = 1; d <= result.dim; d++) {
      const info = L.days[d];
      if (!info) continue;
      const day = result.days[d];
      const text = day.lines.join('\n');
      const sc = W.setText(info.sessRef, text);
      if (text) {
        restyle(sc, { wrap: true, yellow: phDays.has(d) });
        const sz = St ? St.fontSize(sc.getAttribute('s')) : 11;
        const pts = wrapLines(text, W.colWidth(info.col)) * sz * 1.3 + 3;
        needRows.set(info.sessRow, Math.max(needRows.get(info.sessRow) || 0, pts));
      }
      const tc = W.setNumber(info.totalRef, day.cents ? day.cents / 100 : null);
      if (day.cents) restyle(tc, { currency: true });
      if (phDays.has(d)) { const dc = W.setText(info.dateRef, `${d} PH`); restyle(dc, { yellow: true, right: true }); }
    }
    for (const [r, pts] of needRows) W.rowHeight(r, pts);

    for (const wk of L.weeks) {
      const cents = wk.days.reduce((a, d) => a + (result.days[d] ? result.days[d].cents : 0), 0);
      restyle(W.setNumber(wk.weekTotalRef, cents / 100), { currency: true });
    }
    if (L.finalSumRef) restyle(W.setNumber(L.finalSumRef, result.totalCents / 100), { currency: true });

    // Make Excel recalculate the template's own formulas on open
    const wbRoot = wb.documentElement;
    let calcPr = kid(wbRoot, 'calcPr');
    if (!calcPr) {
      calcPr = wb.createElementNS(NS, 'calcPr');
      const later = ['oleSize', 'customWorkbookViews', 'pivotCaches', 'smartTagPr', 'smartTagTypes', 'webPublishing', 'fileRecoveryPr', 'webPublishObjects', 'extLst'];
      wbRoot.insertBefore(calcPr, [...wbRoot.children].find(c => later.includes(c.localName)) || null);
    }
    calcPr.setAttribute('fullCalcOnLoad', '1');

    // Rebuild the package; drop calcChain (Excel regenerates it)
    const changed = { [tpl.sheetPath]: serialize(sheet), 'xl/workbook.xml': serialize(wb) };
    if (styles) changed[tpl.stylesPath] = serialize(styles);
    let entries = tpl.entries.filter(e => !/calcChain\.xml$/.test(e.name));
    const ct = await entryText(entries, '[Content_Types].xml');
    if (ct) {
      const doc = parseXml(ct, 'content types');
      for (const o of [...doc.getElementsByTagNameNS(NS_CT, 'Override')]) if (/calcChain\.xml$/.test(o.getAttribute('PartName'))) o.parentNode.removeChild(o);
      changed['[Content_Types].xml'] = serialize(doc);
    }
    const relsName = 'xl/_rels/workbook.xml.rels';
    const relsDoc = parseXml(await entryText(entries, relsName), 'workbook links');
    for (const r of [...relsDoc.getElementsByTagNameNS(NS_PR, 'Relationship')]) if (/\/calcChain$/.test(r.getAttribute('Type'))) r.parentNode.removeChild(r);
    changed[relsName] = serialize(relsDoc);

    entries = await Promise.all(entries.map(e => changed[e.name] != null ? packEntry(e.name, changed[e.name], e) : e));
    return writeZip(entries);
  }

  function outputName(tplName, tutor) {
    let base = String(tplName || 'Timesheet.xlsx').replace(/\.xlsx$/i, '').replace(/\s*\(\d+\)\s*$/, '').trim();
    base = /template/i.test(base) ? base.replace(/\s*template\s*/i, tutor ? ` ${tutor} ` : ' ').replace(/\s+/g, ' ').trim() : `${base}${tutor ? ' ' + tutor : ''}`;
    return base + '.xlsx';
  }

  return { load, fill, check, phDaysFor, outputName, wrapLines, readZip, writeZip, crc32 };
})();
</script>

  function save() {

  let statusTimer = null;

  // ── Theme ─────────────────────────────────────────────────────────────────
  function currentTheme() {
    const set = document.documentElement.getAttribute('data-theme');
    if (set) return set;
    return matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  }
  function applyTheme(t) {
    if (t) document.documentElement.setAttribute('data-theme', t);
    $('theme-btn').textContent = currentTheme() === 'dark' ? 'Light' : 'Dark';
  }
  try { applyTheme(localStorage.getItem(THEME_KEY)); } catch (e) { applyTheme(null); }
  $('theme-btn').addEventListener('click', () => {
    const t = currentTheme() === 'dark' ? 'light' : 'dark';
    applyTheme(t);
    try { localStorage.setItem(THEME_KEY, t); } catch (e) { /* ignore */ }
  });

  // ── Compute ───────────────────────────────────────────────────────────────
  function compute() {
    result = C.run({ blob: state.blob, settings: state.settings, overrides: state.overrides, manual: state.manual });
    renderResults();
  }
  let debounce = null;
  const computeSoon = () => { clearTimeout(debounce); debounce = setTimeout(() => { save(); compute(); }, 200); };

  const tplProblems = () => state.template && result && !result.empty ? X.check(state.template, result) : [];
  const phDays = () => X.phDaysFor(state.template, result, state.settings.markPH);
  const anchor = () => state.template ? state.template.layout.anchorRef : 'B4';

  // ── Render: results ───────────────────────────────────────────────────────
  function renderResults() {
    const r = result;
    $('blob-meta').textContent = state.blob.trim() ? `${state.blob.split('\n').length} lines` : '';
    $('tb-month').textContent = r && !r.empty ? r.monthLabel : '';
    renderStats();
    renderFlags();
    renderTabs();
    renderTemplateInfo();
    renderStatus();
  }

  function renderStats() {
    const r = result;
    if (!r || r.empty) { $('stats').innerHTML = ''; return; }
    const open = r.counts.error + r.counts.warn;
    const stat = (title, val, unit, extra = '') => `<div class="panel"><h3 class="panel__title">${title}${extra}</h3><div class="stat">${val}<span class="stat__unit">${unit}</span></div></div>`;
    $('stats').innerHTML =
      stat('Final sum', esc(C.fmtMoney(r.totalCents)), '') +
      stat('Lessons', r.count, '') +
      stat('Hours billed', C.fmtHrs(r.billedMins), 'hrs') +
      stat('To check', open, open ? 'open' : '', open ? (r.counts.error ? ' <span class="badge badge--danger">Error</span>' : ' <span class="badge badge--warning">Check</span>') : ' <span class="badge badge--success">Clear</span>');
  }

  function renderFlags() {
    const r = result;
    const items = [];
    for (const p of tplProblems()) items.push({ level: 'error', when: 'Template', text: p });
    if (r) {
      for (const f of r.flags) if (f.level !== 'info') items.push({ level: f.level, when: '', text: f.text });
      if (!r.empty) for (const s of r.sessions) for (const f of s.flags) if (f.level !== 'info' && !f.resolved) items.push({ level: f.level, when: `${s.label} · ${s.student}`, text: f.text, id: s.id });
    }
    if (!r || (r.empty && !items.length)) {
      $('flags').innerHTML = `<div class="alert alert--info"><span class="alert__icon">i</span><div><div class="alert__title">Paste the month's calendar</div><div class="alert__body">Copy the month from Google Calendar's schedule view and paste it on the left, or load the August sample.</div></div></div>`;
      return;
    }
    if (!items.length) {
      const info = r.flags.filter(f => f.level === 'info').map(f => `<li><span class="glyph lv-info">i</span><span>${esc(f.text)}</span></li>`).join('');
      $('flags').innerHTML = `<div class="alert alert--success"><span class="alert__icon">✓</span><div><div class="alert__title">Nothing to check</div><div class="alert__body">Every lesson was read cleanly. Notes are in the Sessions tab.</div>${info ? `<ul class="flaglist">${info}</ul>` : ''}</div></div>`;
      return;
    }
    const hasErr = items.some(i => i.level === 'error');
    $('flags').innerHTML = `<div class="alert ${hasErr ? 'alert--danger' : 'alert--warning'}" role="status"><span class="alert__icon">${hasErr ? 'x' : '!'}</span><div style="min-width:0">
      <div class="alert__title">${items.length} item${items.length > 1 ? 's' : ''} to check</div>
      <div class="alert__body">Fix or confirm these before sending. Mark a lesson checked in the Sessions tab once you've confirmed it.</div>
      <ul class="flaglist">${items.map(i => `<li><span class="glyph lv-${i.level}">${GLYPH[i.level]}</span><span>${i.when ? (i.id ? `<button class="linkbtn when" data-act="goto" data-id="${esc(i.id)}">${esc(i.when)}</button> ` : `<span class="when">${esc(i.when)}</span> `) : ''}${esc(i.text)}</span></li>`).join('')}</ul>
    </div></div>`;
  }

  function renderTabs() {
    for (const b of document.querySelectorAll('#tabs .tab')) b.setAttribute('aria-selected', String(b.dataset.tab === state.tab));
    const r = result, bar = $('out-bar'), body = $('out-body');
    if (!r || r.empty) { bar.innerHTML = ''; body.innerHTML = '<p class="muted" style="margin:0">Results appear here.</p>'; return; }

    const dl = state.template
      ? `<button class="btn ${blocked ? '' : 'btn--primary'}" data-act="download" ${blocked ? 'disabled' : ''}>Download .xlsx</button>`

      bar.innerHTML = `<span class="field__help">Select <b class="mono">${esc(anchor())}</b> in the centre's sheet, then paste. Click any lesson cell to copy just that cell.</span>

  function gridHtml(r) {

    for (const wk of r.weeks) {
      h += `<tr><td class="lbl">Date</td>${wk.cells.map(d => d ? `<td class="date${ph.has(d) || r.days[d].ph ? ' ph' : ''}" title="${esc(r.days[d].ph || '')}">${d}${ph.has(d) ? ' PH' : r.days[d].ph ? ' <span class="muted">(PH)</span>' : ''}</td>` : '<td class="void"></td>').join('')}<td></td></tr>`;
