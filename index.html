        if (!d) return '<td class="void"></td>';
        const day = r.days[d], cls = day.status === 'error' ? ' has-error' : day.status === 'warn' ? ' has-warn' : '';
        return `<td class="sess${cls}" data-act="copy-cell" data-d="${d}" title="Click to copy">${esc(day.lines.join('\n'))}</td>`;
      }).join('')}<td></td></tr>`;
      h += `<tr class="tot"><td class="lbl">Total cost</td>${wk.cells.map(d => d ? `<td class="num">${r.days[d].cents ? esc(C.fmtMoney(r.days[d].cents)) : ''}</td>` : '<td class="void"></td>').join('')}<td class="num">${esc(C.fmtMoney(wk.cents))}</td></tr>`;
    }
    h += `<tr class="grand"><td colspan="8">Final sum</td><td class="num">${esc(C.fmtMoney(r.totalCents))}</td></tr></tbody></table>`;
    return h;
  }

  function sessionsHtml(r) {
    const roster = state.settings.rates.map(x => x.name).filter(Boolean);
    let h = `<table class="table sess-table"><thead><tr><th>Bill</th><th>Date</th><th>Student</th><th>Time</th><th class="num">Hrs</th><th class="num">Amount</th><th>Notes</th></tr></thead><tbody>`;
    if (!r.sessions.length) h += `<tr><td colspan="7" class="muted">No Educare4u lessons found.</td></tr>`;
    for (const s of r.sessions) {
      const warns = s.flags.filter(f => f.level === 'warn');
      const timeCell = `
        ${s.candidates.length > 1 ? `<select class="input input--sm input--mono" data-f="choice" data-id="${esc(s.id)}" style="width:auto;margin-bottom:4px" aria-label="Calendar entry">
          ${s.candidates.map((c, i) => `<option value="${i}" ${i === s.choice ? 'selected' : ''}>${esc(C.fmtRange(c.start, c.end))}</option>`).join('')}</select><br>` : ''}
        <input class="input input--sm input--mono" type="time" step="300" value="${Number.isFinite(s.start) ? C.hhmm(s.start) : ''}" data-f="start" data-id="${esc(s.id)}" aria-label="Start">
        <input class="input input--sm input--mono" type="time" step="300" value="${Number.isFinite(s.end) ? C.hhmm(s.end) : ''}" data-f="end" data-id="${esc(s.id)}" aria-label="End" ${s.valid ? '' : 'aria-invalid="true"'}>`;
      h += `<tr data-id="${esc(s.id)}" class="${s.include ? '' : 'is-off'}">
        <td><input type="checkbox" data-f="include" data-id="${esc(s.id)}" ${s.include ? 'checked' : ''} aria-label="Bill this lesson"></td>
        <td style="white-space:nowrap">${esc(s.label)}${s.ph ? '<span class="sub">PH</span>' : ''}</td>
        <td>${esc(s.student)}<span class="sub">${esc([s.subject, s.format === 'Zoom' ? 'Zoom' : s.location].filter(Boolean).join(' · '))}</span></td>
        <td class="time">${timeCell}</td>
        <td class="num">${s.valid ? C.fmtHrs(s.billedMins) : '–'}</td>
        <td class="num amt">${esc(C.fmtMoney(s.grossCents))}<span class="sub">$${esc(s.rate)}/hr</span></td>
        <td><div class="notes">${s.flags.map(f => `<div class="${f.resolved ? 'resolved' : ''}"><span class="glyph lv-${f.resolved ? 'ok' : f.level}">${f.resolved ? '✓' : GLYPH[f.level]}</span><span>${esc(f.text)}</span></div>`).join('') || '<div class="muted">—</div>'}
          <div class="row" style="margin-top:4px">
            ${warns.length ? `<button class="btn btn--sm ${s.ack ? 'btn--ghost' : ''}" data-act="ack" data-id="${esc(s.id)}">${s.ack ? 'Undo checked' : 'Mark checked'}</button>` : ''}
            ${s.edited || Number.isInteger((state.overrides[s.id] || {}).choice) ? `<button class="btn btn--sm btn--ghost" data-act="reset-one" data-id="${esc(s.id)}">Reset</button>` : ''}
            ${s.manual ? `<button class="btn btn--sm btn--danger" data-act="del-manual" data-id="${esc(s.id)}">Remove</button>` : ''}
          </div></div></td></tr>`;
    }
    h += `</tbody></table>
      <form class="add-form" id="add-form">
        <label class="field"><span>Day</span><select class="input input--mono" name="d">${Array.from({ length: r.dim }, (_, i) => `<option value="${i + 1}">${esc(C.shortDate(r.y, r.m, i + 1))}</option>`).join('')}</select></label>
        <label class="field"><span>Student</span><input class="input" name="student" list="roster" required style="width:140px"></label>
        <label class="field"><span>Start</span><input class="input input--mono" type="time" step="300" name="start" required></label>
        <label class="field"><span>End</span><input class="input input--mono" type="time" step="300" name="end" required></label>
        <button class="btn" type="submit">Add lesson</button>
        <datalist id="roster">${roster.map(n => `<option value="${esc(n)}">`).join('')}</datalist>
      </form>`;
    return h;
  }

  function renderTemplateInfo() {
    const t = state.template;
    if (state.templateError) {
      $('tpl-badge').innerHTML = '<span class="badge badge--danger">Error</span>';
      $('tpl-info').innerHTML = `<div class="alert alert--danger"><span class="alert__icon">x</span><div><div class="alert__title">Could not read template</div><div class="alert__body">${esc(state.templateError)}</div></div></div>`;
      return;
    }
    if (!t) { $('tpl-badge').innerHTML = ''; $('tpl-info').innerHTML = ''; return; }
    const L = t.layout, probs = tplProblems();
    $('tpl-badge').innerHTML = probs.length ? '<span class="badge badge--danger">Mismatch</span>' : '<span class="badge badge--cyan">Ready</span>';
    $('tpl-info').innerHTML = `<table class="table"><tbody>
      <tr><td class="muted">File</td><td>${esc(t.fileName)}</td></tr>
      <tr><td class="muted">Month</td><td>${L.month >= 0 ? esc(C.MONTHS[L.month] + ' ' + L.year) : '?'}</td></tr>
      <tr><td class="muted">Sheet</td><td>${esc(t.sheetName)}${t.sheetCount > 1 ? ` (first of ${t.sheetCount})` : ''} · ${L.weeks.length} weeks · paste at ${esc(L.anchorRef)}</td></tr>
      <tr><td class="muted">Saves as</td><td>${esc(X.outputName(t.fileName, state.settings.tutor))}</td></tr>
    </tbody></table>
    <div class="row" style="margin-top: var(--space-2)"><button class="btn btn--sm btn--ghost" data-act="clear-tpl">Remove</button></div>`;
  }

  function renderStatus() {
    const r = result;
    $('status').textContent = !r || r.empty ? 'Ready' : `${r.monthLabel} · ${r.count} lessons · ${C.fmtHrs(r.billedMins)} hrs · ${C.fmtMoney(r.totalCents)}${state.template ? ' · template loaded' : ''}`;
  }

  // ── Render: settings ──────────────────────────────────────────────────────
  function renderSettings() {
    const S = state.settings;
    const rule = (r, i) => {
      const num = (f, v, step = '0.5') => `<input class="input input--sm input--mono input--num" type="number" min="0" step="${step}" value="${esc(v)}" data-s="rule" data-i="${i}" data-k="${f}">`;
      let fields;
      if (r.type === 'window') fields = `<span class="muted">from</span><input class="input input--sm input--mono input--num" style="flex-basis:76px;width:76px" value="${esc(r.start || '')}" placeholder="14:30" data-s="rule" data-i="${i}" data-k="start"><span class="muted">to</span><input class="input input--sm input--mono input--num" style="flex-basis:76px;width:76px" value="${esc(r.end || '')}" placeholder="18:30" data-s="rule" data-i="${i}" data-k="end"><span class="muted">break</span>${num('breakMins', r.breakMins, '5')}<span class="muted">min</span>`;
      else if (r.type === 'exact_hours') fields = `<span class="muted">if exactly</span>${num('minHours', r.minHours)}<span class="muted">h: bill</span>${num('billHours', r.billHours)}<span class="muted">h, break</span>${num('breakHours', r.breakHours)}<span class="muted">h</span>`;
      else fields = `<span class="muted">if</span>${num('minHours', r.minHours)}<span class="muted">h or more, deduct</span>${num('breakMins', r.breakMins, '5')}<span class="muted">min</span>`;
      return `<div class="rule">
        <div class="row"><input class="input input--sm" value="${esc(r.label)}" data-s="rule" data-i="${i}" data-k="label" aria-label="Rule name"><button class="x" data-act="del-rule" data-i="${i}" aria-label="Delete rule">x</button></div>
        <div class="row">
          <select class="input input--sm" data-s="rule" data-i="${i}" data-k="type" aria-label="Rule type">
            <option value="break_over" ${r.type === 'break_over' ? 'selected' : ''}>Break if long</option>
            <option value="window" ${r.type === 'window' ? 'selected' : ''}>Exact time window</option>
            <option value="exact_hours" ${r.type === 'exact_hours' ? 'selected' : ''}>Split long session</option>
          </select>
          <input class="input input--sm" value="${esc(r.student)}" placeholder="Anyone" list="roster-s" data-s="rule" data-i="${i}" data-k="student" aria-label="Student">
        </div>
        <div class="row">${fields}</div>
      </div>`;
    };
    $('settings-body').innerHTML = `
      <div class="set-sec" style="border-top:0;padding-top:0">
        <label class="field"><span>Your name</span><input class="input" value="${esc(S.tutor)}" data-s="tutor"></label>
        <p class="field__help">Fills "Name" in the sheet and is ignored in titles like "Jade x Sam".</p>
        <label class="toggle"><input type="checkbox" role="switch" data-s="markPH" ${S.markPH ? 'checked' : ''}> Mark public holidays as "9 PH"</label>
      </div>
      <div class="set-sec">
        <h3>Hourly rates</h3>
        ${S.rates.map((r, i) => `<div class="rate-row"><input class="input input--sm" value="${esc(r.name)}" data-s="rate" data-i="${i}" data-k="name" aria-label="Student"><input class="input input--sm input--mono" type="number" min="0" step="0.5" value="${esc(r.rate)}" data-s="rate" data-i="${i}" data-k="rate" aria-label="Rate per hour"><button class="x" data-act="del-rate" data-i="${i}" aria-label="Delete ${esc(r.name)}">x</button></div>`).join('')}
        <div class="rate-row"><span class="muted">Anyone else</span><input class="input input--sm input--mono" type="number" min="0" step="0.5" value="${esc(S.defaultRate)}" data-s="defaultRate" aria-label="Default rate"><span></span></div>
        <div class="row"><button class="btn btn--sm" data-act="add-rate">Add student</button></div>
        <datalist id="roster-s">${S.rates.map(r => `<option value="${esc(r.name)}">`).join('')}</datalist>
      </div>
      <div class="set-sec">
        <h3>Billing rules</h3>
        ${S.rules.map(rule).join('') || '<p class="field__help">No rules.</p>'}
        <div class="row"><button class="btn btn--sm" data-act="add-rule">Add rule</button></div>
      </div>
      <div class="set-sec">
        <h3>Public holidays</h3>
        <textarea class="input input--mono" rows="6" data-s="holidays" spellcheck="false">${esc(S.holidays)}</textarea>
        <p class="field__help">One per line: YYYY-MM-DD name. Pre-filled with Singapore 2026; add next year's from MOM.</p>
      </div>
      <div class="set-sec"><div class="row"><button class="btn btn--sm btn--danger" data-act="reset-settings">Reset settings</button></div></div>`;
  }

  // ── Events ────────────────────────────────────────────────────────────────
  $('blob').addEventListener('input', e => { state.blob = e.target.value; computeSoon(); });

  $('settings-body').addEventListener('input', e => {
    const el = e.target, k = el.dataset.s;
    if (!k) return;
    const S = state.settings;
    if (k === 'tutor' || k === 'holidays' || k === 'defaultRate') S[k] = el.value;
    else if (k === 'markPH') S.markPH = el.checked;
    else if (k === 'rate') S.rates[+el.dataset.i][el.dataset.k] = el.value;
    else if (k === 'rule') {
      S.rules[+el.dataset.i][el.dataset.k] = el.value;
      if (el.dataset.k === 'type') { renderSettings(); }
    }
    computeSoon();
  });

  document.addEventListener('click', async e => {
    const t = e.target.closest('[data-act]');
    if (!t) return;
    const act = t.dataset.act, S = state.settings;
    if (act === 'sample') { state.blob = PRIVATE.sample || SAMPLE; $('blob').value = state.blob; save(); compute(); status('Loaded the August 2026 sample.'); }
    else if (act === 'clear-blob') { state.blob = ''; $('blob').value = ''; save(); compute(); }
    else if (act === 'add-rate') { S.rates.push({ name: '', rate: S.defaultRate }); renderSettings(); save(); const ins = $('settings-body').querySelectorAll('[data-s="rate"][data-k="name"]'); ins[ins.length - 1].focus(); }
    else if (act === 'del-rate') { S.rates.splice(+t.dataset.i, 1); renderSettings(); save(); compute(); }
    else if (act === 'add-rule') { S.rules.push({ id: Date.now(), label: 'New rule', type: 'break_over', student: '', minHours: 3, breakMins: 30, billHours: 2, breakHours: 1, start: '', end: '' }); renderSettings(); save(); compute(); }
    else if (act === 'del-rule') { S.rules.splice(+t.dataset.i, 1); renderSettings(); save(); compute(); }
    else if (act === 'reset-settings') { if (confirm('Reset rates, rules and holidays to the defaults?')) { state.settings = defaults(); renderSettings(); save(); compute(); } }
    else if (act === 'goto') { state.tab = 'sessions'; state.focusId = t.dataset.id; renderTabs(); }
    else if (act === 'ack') { const o = state.overrides[t.dataset.id] || (state.overrides[t.dataset.id] = {}); o.ack = !o.ack; save(); compute(); }
    else if (act === 'reset-one') { delete state.overrides[t.dataset.id]; save(); compute(); }
    else if (act === 'del-manual') { state.manual = state.manual.filter(m => m.id !== t.dataset.id); delete state.overrides[t.dataset.id]; save(); compute(); }
    else if (act === 'reset-edits') { if (confirm('Clear all time edits, choices, exclusions and added lessons?')) { state.overrides = {}; state.manual = []; save(); compute(); } }
    else if (act === 'copy-tsv') { await copy(C.buildTSV(result, { phDays: phDays() })); status(`Copied ${result.weeks.length * 3} rows. Select ${anchor()} in the centre's sheet and paste (Ctrl+V).`); }
    else if (act === 'copy-cell') { const d = +t.dataset.d; await copy(result.days[d].lines.join('\n')); status(`Copied ${C.shortDate(result.y, result.m, d)}.`); }
    else if (act === 'copy-text') { await copy(C.buildText(result)); status('Copied the text summary.'); }
    else if (act === 'clear-tpl') { state.template = null; state.templateError = ''; $('tpl-file').value = ''; renderResults(); }
    else if (act === 'download') { await download(); }
  });

  document.addEventListener('click', e => {
    const tab = e.target.closest('#tabs .tab');
    if (tab) { state.tab = tab.dataset.tab; save(); renderTabs(); }
  });
  $('tabs').addEventListener('keydown', e => {
    if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
    const tabs = [...document.querySelectorAll('#tabs .tab')], i = tabs.findIndex(x => x.dataset.tab === state.tab);
    const n = tabs[(i + (e.key === 'ArrowRight' ? 1 : tabs.length - 1)) % tabs.length];
    state.tab = n.dataset.tab; save(); renderTabs(); n.focus();
  });

  // Session table edits (change = committed value)
  $('out-body').addEventListener('change', e => {
    const el = e.target, f = el.dataset.f, id = el.dataset.id;
    if (!f || !id) return;
    const s = result.sessions.find(x => x.id === id);
    if (!s) return;
    if (s.manual && (f === 'start' || f === 'end')) {
      const m = state.manual.find(x => x.id === id);
      if (m) m[f] = el.value;
    } else {
      const o = state.overrides[id] || (state.overrides[id] = {});
      if (f === 'include') o.include = el.checked;
      else if (f === 'choice') { o.choice = +el.value; delete o.start; delete o.end; }
      else {
        o.start = f === 'start' ? el.value : C.hhmm(s.start);
        o.end = f === 'end' ? el.value : C.hhmm(s.end);
        if (C.toMins(o.start) === s.calStart && C.toMins(o.end) === s.calEnd) { delete o.start; delete o.end; }
      }
    }
    save(); compute();
  });
  $('out-body').addEventListener('submit', e => {
    if (e.target.id !== 'add-form') return;
    e.preventDefault();
    const fd = new FormData(e.target);
    const d = +fd.get('d');
    state.manual.push({ id: 'manual-' + Date.now(), date: `${result.y}-${String(result.m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`, student: String(fd.get('student')).trim(), start: fd.get('start'), end: fd.get('end') });
    save(); compute();
    status('Lesson added.');
  });

  async function copy(text) {
    try { await navigator.clipboard.writeText(text); }
    catch (err) {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
    }
  }

  // ── Template file ─────────────────────────────────────────────────────────
  async function takeFile(file) {
    if (!file) return;
    state.templateError = '';
    try {
      if (!/\.xlsx$/i.test(file.name)) throw new Error('Choose an .xlsx file (Excel Workbook). Old .xls files must be re-saved as .xlsx first.');
      state.template = await X.load(await file.arrayBuffer(), file.name);
      status(`Template loaded: ${file.name}`);
    } catch (err) {
      state.template = null;
      state.templateError = err.message || String(err);
    }
    renderResults();
  }
  $('tpl-file').addEventListener('change', e => takeFile(e.target.files[0]));
  const drop = $('drop');
  drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('is-over'); });
  drop.addEventListener('dragleave', () => drop.classList.remove('is-over'));
  drop.addEventListener('drop', e => { e.preventDefault(); drop.classList.remove('is-over'); takeFile(e.dataTransfer.files[0]); });

  async function download() {
    try {
      const blob = await X.fill(state.template, result, { name: state.settings.tutor, markPH: state.settings.markPH });
      const name = X.outputName(state.template.fileName, state.settings.tutor);
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 10000);
      const open = result.counts.error + result.counts.warn;
      status(`Saved ${name}${open ? ` — ${open} item(s) still flagged` : ''}.`);
    } catch (err) {
      status('Could not build the workbook: ' + (err.message || err));
    }
  }

  // ── Boot ──────────────────────────────────────────────────────────────────
  load();
  $('blob').value = state.blob;
  renderSettings();
  compute();
})();
</script>
</body>
</html>
